aid: ro
name: Ro
description: >-
  Ro (ro.co) is a direct-to-consumer telehealth company that connects patients with
  US-licensed healthcare providers entirely online, offering prescription treatment,
  provider visits, and pharmacy fulfillment across categories including men's and
  women's health, weight management (Ro Body), dermatology (Ro Derm), hair loss,
  fertility (Ro Fertility), and sexual health. Ro deliberately operates a "Zero-API"
  vertically integrated online-visit experience and does not publish a public
  developer API, SDKs, or a developer portal; its only public machine-readable
  surface is a security posture (RFC 9116 security.txt and a HackerOne vulnerability
  disclosure program). Ro is backed by Canaan Partners, General Catalyst, and
  Initialized Capital.
